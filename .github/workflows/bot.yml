name: Prezident bot

on:
  schedule:
    - cron: "*/5 * * * *"   # har 5 daqiqada
  workflow_dispatch:        # qo'lda ishga tushirish tugmasi

permissions:
  contents: write

concurrency:
  group: prezident-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Botni ishga tushirish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
        run: python main.py
      - name: Holatni saqlash
        run: |
          git config user.name "prezident-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "holat yangilandi" && git push) || true
